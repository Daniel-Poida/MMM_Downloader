[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-downloader"
version = "0.2.1"
description = "Windows GUI and CLI for authorized YouTube downloads in MP4/H.264"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "imageio-ffmpeg>=0.6.0",
  "keyring>=25.6,<27",
  "yt-dlp[default]>=2025.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
build = [
  "pillow>=11.0",
  "pyinstaller>=6.11",
]

[project.scripts]
mmm-downloader = "ytmax.cli:main"

[project.gui-scripts]
mmm-downloader-gui = "ytmax.gui:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
